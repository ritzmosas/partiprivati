# Band Information
bandName: "partiprivati"
tagline: ""
description: |
  Partiprivati ist wie ein Flipper. Frech, frisch und ein bisschen verrückt
  flippen sie mit ihren Liedern durch verschiedene Stile und
  gesellschaftliche Themen. Mit dabei sind Cello, Synth, Piano, Drums und
  Gesang so klar, wie der einer Amsel.
  In der Freizeit kullert Partiprivati gerne von Hügeln. Falls sie mal nicht
  kullern, denken sie tiefsinnig über das Leben nach.

